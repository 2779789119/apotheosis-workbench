displayName="Apotheosis Workbench / 神化工作台"
authors="Blockforge"
credits="Built for Apotheosis by Shadows of Fire. Not affiliated with the Apotheosis team."
logoFile="logo.png"
description='''
An in-game workbench for Apotheosis affixes: browse every affix, create custom ones, delete or disable
built-in ones, and pick which rarities each affix belongs to. Every edit is written to a per-world datapack
and can be reverted at any time.

一个面向神化（Apotheosis）词条的管理工作台：在游戏内直接浏览、添加、删除、禁用词条，
并调整每条词条所处的品阶（稀有度）。所有修改都会写入存档的数据包并可一键回滚。
'''

